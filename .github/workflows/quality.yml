name: Review quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - name: Install locked public test dependencies
        run: npm run test:setup
      - name: Test deterministic core and evidence UI
        run: npm test
      - name: Check core types
        run: npm run typecheck:core
