name: Verify and publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-review-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 pnpm@11.20.0 --ignore-scripts
      - name: Verify prepared runtime and portable source
        run: |
          node scripts/check-release.mjs
          npm ci --prefix validation --ignore-scripts --no-audit --no-fund
          node validation/run.mjs
          node validation/node_modules/typescript/bin/tsc -p validation/tsconfig.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 86a402200d95fecef4529d969836f1fe13c6cb0d
          path: .artifacts/dsh-source
          persist-credentials: false
      - name: Install rc.3 integration dependencies
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile,mkdir} from 'node:fs/promises'
          const target=process.env.RUNNER_TEMP+'/dsh-rc3'
          await mkdir(target)
          const pkg=JSON.parse(await readFile('validation/harness/package.json','utf8'))
          for(const key of Object.keys(pkg.dependencies))if(key.startsWith('@deepseek-ai/dsh'))pkg.dependencies[key]='0.2.1-rc.3'
          pkg.dependencies['@deepseek-ai/dsh-util-workspace-path']='0.2.1-rc.3'
          await writeFile(target+'/package.json',JSON.stringify(pkg))
          JS
          npm install --prefix "$RUNNER_TEMP/dsh-rc3" --ignore-scripts --no-audit --no-fund
      - name: Check host/client types and full review integration in rc.3
        run: node scripts/test-published.mjs
        env:
          DSH_HARNESS_SOURCE: ${{ github.workspace }}/.artifacts/dsh-source
          DSH_HARNESS_RUNTIME: ${{ runner.temp }}/dsh-rc3/node_modules
      - name: Pack and test the exact release archive
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/dsh-article-review-$(node -p 'require("./package.json").version').tgz"
          node scripts/runtime-smoke.mjs "$RUNNER_TEMP/dsh-rc3/node_modules/.bin/dsh" "$archive"
          cd "$RUNNER_TEMP/release"
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-npm-package
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error

  current-harness:
    needs: verify
    name: DSH ${{ matrix.version }} / release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.2.1-rc.4
            source: 504a01a9578abc2c6f1fb896b1dc322c9fe24f66
          - version: 0.2.2-alpha.2
            source: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm install --global pnpm@11.20.0 --ignore-scripts
      - run: npm ci --prefix validation --ignore-scripts --no-audit --no-fund
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.source }}
          path: .artifacts/dsh-source
          persist-credentials: false
      - name: Install the matching published runtime
        run: |
          node scripts/prepare-test-runtime.mjs '${{ matrix.version }}' "$RUNNER_TEMP/dsh-current"
          npm install --prefix "$RUNNER_TEMP/dsh-current" --ignore-scripts --no-audit --no-fund
      - name: Check host/client types and all review integration tests
        run: node scripts/test-published.mjs
        env:
          DSH_HARNESS_SOURCE: ${{ github.workspace }}/.artifacts/dsh-source
          DSH_HARNESS_RUNTIME: ${{ runner.temp }}/dsh-current/node_modules
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-npm-package
          path: release
      - name: Exercise the exact archive, including restart recovery
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          node scripts/runtime-smoke.mjs "$RUNNER_TEMP/dsh-current/node_modules/.bin/dsh" release/*.tgz

  publish:
    needs: [verify, current-harness]
    if: github.repository == 'Biogod2020/dsh-article-review' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-npm-package
          path: release
      - name: Publish tested archive with npm OIDC
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS
          archives=(*.tgz)
          test "${#archives[@]}" -eq 1
          npm publish "${archives[0]}" --access public --tag latest --ignore-scripts

  verify-installation:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm install --global pnpm@11.20.0 --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-npm-package
          path: release
      - name: Verify registry and mirror archive integrity
        run: node scripts/verify-published.mjs release/*.tgz
      - name: Verify exact release and bare-name install with package-scoped recent-release opt-in
        run: |
          version=$(node -p 'require("./package.json").version')
          for runtime in 0.2.1-rc.3 0.2.1-rc.4 0.2.2-alpha.2; do
            npm install --prefix "$RUNNER_TEMP/dsh-$runtime" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@$runtime"
            for registry in https://registry.npmjs.org https://registry.npmmirror.com; do
              DSH_SMOKE_REGISTRY="$registry" DSH_SMOKE_EXPECT_VERSION="$version" node scripts/runtime-smoke.mjs "$RUNNER_TEMP/dsh-$runtime/node_modules/.bin/dsh" "dsh-article-review@$version"
              DSH_SMOKE_REGISTRY="$registry" DSH_SMOKE_EXPECT_VERSION="$version" DSH_SMOKE_ALLOW_RECENT_PACKAGE=1 node scripts/runtime-smoke.mjs "$RUNNER_TEMP/dsh-$runtime/node_modules/.bin/dsh" dsh-article-review
            done
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: npm-registry-verification
          path: release/*.registries.json
          if-no-files-found: ignore
